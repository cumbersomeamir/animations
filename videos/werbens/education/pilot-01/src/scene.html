<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Werbens Education 01</title>
<style>
  @font-face { font-family: "InterDisplayXB"; src: url(/fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "InterDisplayBlack"; src: url(/fonts/InterDisplay-Black.otf); }
  @font-face { font-family: "InterSB"; src: url(/fonts/Inter-SemiBold.otf); }
  @font-face { font-family: "InterB"; src: url(/fonts/Inter-Bold.otf); }
  :root { --violet: #6234FB; --lav: #CCC0F7; --pale: #F0EAFC; --ink: #1B1433; --hi: #C9B8FF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #140B33; }
  canvas#gl { position: absolute; left: 0; top: 0; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; font-kerning: normal; }
  /* lesson chip */
  #chip { position: absolute; left: 64px; top: 150px; padding: 14px 26px 16px; border-radius: 40px; background: rgba(20,10,52,0.66);
          border: 2px solid rgba(204,192,247,0.55); color: var(--pale); font: 34px/1 "InterB"; letter-spacing: 1.5px; text-transform: uppercase; }
  #chip b { color: var(--hi); font-family: "InterDisplayBlack"; }
  /* captions */
  #cap { position: absolute; left: 70px; right: 70px; top: 1300px; text-align: center; }
  #cap .box { display: inline-block; padding: 20px 34px 26px; border-radius: 36px; background: rgba(18,8,48,0.74);
              border: 2px solid rgba(204,192,247,0.32); box-shadow: 0 18px 50px rgba(8,2,30,0.45); }
  #cap .w { display: inline-block; font: 70px/1.14 "InterDisplayXB"; letter-spacing: -1.2px; color: #FFFFFF; margin: 0 0.12em; will-change: transform, opacity; }
  #cap .w.hi { color: var(--hi); }
  /* tags with leader lines */
  svg#lines { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
  .tag { position: absolute; padding: 10px 24px 13px; border-radius: 30px; background: #F0EAFC; color: #24124F; font: 40px/1 "InterDisplayXB";
         letter-spacing: -0.3px; box-shadow: 0 10px 30px rgba(8,2,30,0.45); transform-origin: 50% 50%; white-space: nowrap; }
  .tag.dim { background: #6F6886; color: #F0EAFC; }
  #eq { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: #F0EAFC; color: #3A1BB5;
        font: 100px/106px "InterDisplayBlack"; text-align: center; box-shadow: 0 0 0 10px rgba(201,184,255,0.45), 0 18px 46px rgba(8,2,30,0.5); }
  #check { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: #6234FB;
           box-shadow: 0 0 0 9px rgba(240,234,252,0.85), 0 16px 40px rgba(8,2,30,0.5); }
  #check svg { position: absolute; inset: 0; }
  #note { position: absolute; left: 50%; transform: translateX(-50%); top: 1548px; padding: 8px 22px 11px; border-radius: 22px; background: rgba(18,8,48,0.72); white-space: nowrap; text-align: center; font: 28px/1.2 "InterSB"; color: rgba(240,234,252,0.9); letter-spacing: 0.2px; }
  #sig { position: absolute; left: 0; right: 0; top: 1540px; text-align: center; }
  #sig .in { display: inline-flex; align-items: center; gap: 16px; padding: 10px 22px 10px 12px; border-radius: 22px; background: rgba(18,8,48,0.55); }
  #sig img { width: 56px; height: 56px; border-radius: 14px; }
  #sig span { font: 38px/1 "InterDisplayXB"; color: #FFFFFF; letter-spacing: -0.6px; }
  #src { position: absolute; left: 60px; right: 60px; top: 1626px; text-align: center; font: 24px/1.3 "InterSB"; color: rgba(240,234,252,0.7); }
  .hide { opacity: 0; }
  /* model-sheet labels */
  #sheetLabel { position: absolute; left: 50%; transform: translateX(-50%); bottom: 40px; padding: 18px 40px 22px; border-radius: 30px; background: rgba(20,10,52,0.82); text-align: center; font: 64px/1 "InterDisplayXB"; color: #F0EAFC; display: none; white-space: nowrap; }
  #sheetLabel small { display: block; margin-top: 12px; font: 42px/1 "InterSB"; color: #C9B8FF; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="hud">
  <svg id="lines"></svg>
  <div id="chip">Marketing craft · <b>01</b></div>
  <div id="tags"></div>
  <div id="eq">=</div>
  <div id="check"><svg viewBox="0 0 120 120"><path d="M33 62 L52 80 L88 42" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="1" id="checkPath"/></svg></div>
  <div id="cap"></div>
  <div id="note">Illustrative demo · not experiment data · effects vary</div>
  <div id="sig"><div class="in"><img src="/assets/icon.png" alt=""><span>Werbens</span></div></div>
  <div id="src">Research: Deliza &amp; MacFie 1996 · Becker et al. 2011 · Piqueras-Fiszman &amp; Spence 2012, 2015</div>
  <div id="sheetLabel"></div>
</div>
<script type="module" src="/src/scene.js"></script>
</body>
</html>
