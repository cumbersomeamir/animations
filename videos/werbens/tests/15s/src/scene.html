<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Werbens 3D Test</title>
<style>
  @font-face { font-family: "InterDisplayXB"; src: url(/fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "InterSB"; src: url(/fonts/Inter-SemiBold.otf); }
  @font-face { font-family: "InterB"; src: url(/fonts/Inter-Bold.otf); }
  :root { --violet: #6234FB; --lav: #CCC0F7; --pale: #F0EAFC; --ink: #1B1433; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #241080; }
  canvas#gl { position: absolute; left: 0; top: 0; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  /* glass caption pill (backdrop blur over the WebGL canvas) */
  .cap { position: absolute; left: 50%; top: 286px; transform-origin: 50% 50%; padding: 22px 44px 28px;
         border-radius: 44px; background: rgba(28,10,104,0.52); border: 2px solid rgba(204,192,247,0.45);
         backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
         box-shadow: 0 18px 50px rgba(20,6,70,0.35); white-space: nowrap; text-align: center; }
  .cap .ln { display: block; font: 82px/1.08 "InterDisplayXB"; letter-spacing: -1.5px; color: #FFFFFF; }
  .cap .w { display: inline-block; will-change: transform, opacity; }
  .cap .hi { color: var(--lav); }
  .chip { position: absolute; padding: 14px 34px 20px; border-radius: 40px; background: rgba(28,10,104,0.55);
          border: 2px solid rgba(204,192,247,0.5); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
          box-shadow: 0 16px 44px rgba(20,6,70,0.35); font: 74px/1.08 "InterDisplayXB"; letter-spacing: -1.2px; color: #fff;
          white-space: nowrap; transform-origin: 50% 50%; }
  .chip.on { background: rgba(98,52,251,0.78); border-color: rgba(240,234,252,0.75); }
  #cta { position: absolute; left: 0; right: 0; top: 0; height: 1920px; text-align: center; }
  #wordmark { position: absolute; left: 0; right: 0; top: 1046px; font: 156px/1 "InterDisplayXB"; letter-spacing: -4px; color: #fff;
              text-shadow: 0 10px 40px rgba(20,6,70,0.45); }
  #tagline { position: absolute; left: 90px; right: 90px; top: 1236px; font: 42px/1.32 "InterSB"; color: rgba(255,255,255,0.92); }
  #tagline .w { display: inline-block; }
  #pill { position: absolute; left: 50%; top: 1386px; width: 720px; height: 128px; margin-left: -360px; border-radius: 64px;
          background: #fff; color: var(--violet); font: 52px/128px "InterDisplayXB"; letter-spacing: -0.5px;
          box-shadow: 0 16px 50px rgba(20,6,70,0.45), inset 0 -6px 0 rgba(98,52,251,0.12); overflow: hidden; }
  #pill .shine { position: absolute; top: -20px; bottom: -20px; width: 120px; background: linear-gradient(100deg, rgba(204,192,247,0), rgba(204,192,247,0.7), rgba(204,192,247,0)); }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="hud">
  <div id="caps"></div>
  <div id="cta">
    <div id="wordmark">Werbens</div>
    <div id="tagline"></div>
    <div id="pill"><span>Explore on Google Play</span><div class="shine"></div></div>
  </div>
</div>
<script type="module" src="/src/scene.js"></script>
</body>
</html>
