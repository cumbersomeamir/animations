<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Werbens 30s Hindi-04 01</title>
<style>
  /* Devanagari: Noto Sans Devanagari (OFL, @fontsource 5.3.0); wordmark: Space Grotesk 700 (as on app.werbens.com) */
  @font-face { font-family: "NSD"; font-weight: 800; src: url(/fonts/NotoSansDevanagari-800.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: "NSD"; font-weight: 800; src: url(/fonts/NotoSansDevanagari-latin-800.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2018-201F, U+2026, U+2212; }
  @font-face { font-family: "NSD"; font-weight: 700; src: url(/fonts/NotoSansDevanagari-700.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: "NSD"; font-weight: 700; src: url(/fonts/NotoSansDevanagari-latin-800.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2018-201F, U+2026, U+2212; }
  @font-face { font-family: "SG"; font-weight: 700; src: url(/fonts/SpaceGrotesk-700-latin.woff2) format("woff2"); }
  /* brand tokens measured on app.werbens.com (context/17) */
  :root { --teal: #316879; --mint: #7FE7DC; --teal2: #5CE0D2; --ink: #0F172A; --mintw: #F0FDFA; --navy: #0B1120; --slate: #64748B; --line: rgba(49,104,121,0.16); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--mintw); }
  canvas#gl { position: absolute; left: 0; top: 0; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  /* accepted caption treatment (pill, word groups, brighten as spoken); Devanagari face + taller line box for matras */
  #cap { position: absolute; left: 90px; right: 90px; top: 340px; height: 180px; display: flex; align-items: center; justify-content: center; }
  #cap .pill { padding: 8px 32px 12px; border-radius: 30px; background: rgba(15,23,42,0.92); box-shadow: 0 14px 36px rgba(15,23,42,0.2); text-align: center; max-width: 900px; }
  #cap .ln { display: block; font: 800 52px/74px "NSD"; letter-spacing: 0; color: #FFFFFF; white-space: nowrap; }
  #cap .w { display: inline-block; margin: 0 0.12em; } #cap .w.hi { color: var(--mint); }
  #chip { position: absolute; left: 50%; top: 562px; transform: translateX(-50%); padding: 6px 26px 10px; border-radius: 26px; background: #FFFFFF; border: 2px solid var(--line);
          font: 700 34px/48px "NSD"; color: var(--ink); white-space: nowrap; box-shadow: 0 8px 20px rgba(15,23,42,0.06); }
  .tag { position: absolute; padding: 6px 24px 10px; border-radius: 20px; background: #FFFFFF; text-align: center; white-space: nowrap;
         box-shadow: 0 10px 26px rgba(15,23,42,0.1); border: 2px solid var(--line); font: 700 36px/50px "NSD"; color: var(--ink); }
  .note { position: absolute; padding: 4px 22px 10px; border-radius: 18px; background: var(--teal); color: #fff; font: 800 40px/56px "NSD"; white-space: nowrap; box-shadow: 0 10px 24px rgba(49,104,121,0.28); transform-origin: 50% 50%; }
  .note.ink { background: var(--ink); box-shadow: 0 10px 24px rgba(15,23,42,0.25); }
  .note.mint { background: var(--mint); color: var(--ink); box-shadow: 0 10px 24px rgba(92,224,210,0.35); }
  .note.light { background: #FFFFFF; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 8px 20px rgba(15,23,42,0.08); }
  .rule { font: 800 46px/62px "NSD"; background: var(--mint) !important; color: var(--ink) !important; border-color: var(--mint) !important; }
  svg#ov { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  #rec { position: absolute; font: 700 36px/48px "NSD"; color: var(--ink); white-space: nowrap; }
  #rec i { display: inline-block; width: 22px; height: 22px; border-radius: 11px; background: #E5484D; margin-right: 10px; vertical-align: -2px; }
  /* official lockup from app.werbens.com: wordmark Space Grotesk 700, −0.04em, 135° #7FE7DC→#316879 gradient text */
  #lockup { position: absolute; left: 540px; top: 1270px; white-space: nowrap; font: 700 104px/118px "SG"; letter-spacing: -0.04em;
            background: linear-gradient(135deg, #7FE7DC, #316879); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tagline { position: absolute; left: 540px; top: 1400px; font: 700 34px/48px "NSD"; color: var(--slate); white-space: nowrap; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="hud">
  <svg id="ov"></svg>
  <div id="chip">काल्पनिक प्रोडक्ट</div>
  <div class="note ink" id="nBefore">पहले</div>
  <div class="note mint" id="nAfter">बाद में</div>
  <div class="note" id="nProof">सबूत</div>
  <div class="note light rule" id="r1">वही एंगल</div>
  <div class="note light rule" id="r2">वही रोशनी</div>
  <div class="note light rule" id="r3">कोई फ़िल्टर नहीं</div>
  <div id="lockup">Werbens</div>
  <div id="tagline">ब्रांड्स कैसे बेचते हैं, समझिए</div>
  <div id="cap"></div>
</div>
<script type="module" src="/src/scene.js"></script>
</body>
</html>
