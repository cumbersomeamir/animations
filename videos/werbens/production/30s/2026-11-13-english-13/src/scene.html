<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Werbens 30s English-13 01</title>
<style>
  /* captions: Inter Display ExtraBold (OFL, accepted); big labels + wordmark: Space Grotesk 700 (as on app.werbens.com) */
  @font-face { font-family: "IDXB"; src: url(/fonts/InterDisplay-ExtraBold.otf) format("opentype"); }
  @font-face { font-family: "IDBK"; src: url(/fonts/InterDisplay-Black.otf) format("opentype"); }
  @font-face { font-family: "IB"; src: url(/fonts/Inter-Bold.otf) format("opentype"); }
  @font-face { font-family: "ISB"; src: url(/fonts/Inter-SemiBold.otf) format("opentype"); }
  @font-face { font-family: "SG"; font-weight: 700; src: url(/fonts/SpaceGrotesk-700-latin.woff2) format("woff2"); }
  /* brand tokens measured on the live app.werbens.com (context/17, re-checked 2026-11-11): dark-navy hero, mint/teal accents */
  :root { --teal: #316879; --mint: #7FE7DC; --teal2: #5CE0D2; --ink: #0F172A; --mintw: #F0FDFA; --navy: #0B1120; --slate: #64748B;
          --hero: linear-gradient(135deg, #7FE7DC, #5CE0D2 50%, #FFFFFF); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  canvas#gl { position: absolute; left: 0; top: 0; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  /* accepted caption treatment (pill, word groups, brighten as spoken) on the site's dark glass panel; inside x 100–900 (context/27) */
  #cap { position: absolute; left: 100px; width: 800px; top: 330px; height: 200px; display: flex; align-items: center; justify-content: center; }
  #cap .pill { padding: 14px 28px 16px; border-radius: 30px; background: rgba(9,16,30,0.86); border: 2px solid rgba(127,231,220,0.3);
               box-shadow: 0 14px 36px rgba(0,0,0,0.35); text-align: center; max-width: 800px; box-sizing: border-box; }
  #cap .ln { display: block; font: 52px/60px "IDXB"; letter-spacing: -0.8px; color: var(--mintw); white-space: nowrap; }
  #cap .w { display: inline-block; margin: 0 0.11em; } #cap .w.hi { color: var(--mint); }
  /* big brief labels, one at a time: Space Grotesk 700 with the site's hero-headline gradient */
  .big { position: absolute; font: 700 120px/128px "SG"; letter-spacing: -0.04em; white-space: nowrap; background: var(--hero);
         -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 6px 8px; transform-origin: 50% 50%; }
  .big.sm { font-size: 96px; line-height: 104px; }
  /* official lockup from app.werbens.com: wordmark Space Grotesk 700, −0.04em, 135° #7FE7DC→#316879 gradient text */
  #lockup { position: absolute; left: 540px; top: 1270px; white-space: nowrap; font: 700 104px/118px "SG"; letter-spacing: -0.04em;
            background: linear-gradient(135deg, #7FE7DC, #316879); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tagline { position: absolute; left: 540px; top: 1400px; font: 34px/46px "ISB"; color: rgba(240,253,250,0.72); white-space: nowrap; }
  /* thumbnail mode only (?thumb=1) */
  #thumb { display: none; position: absolute; inset: 0; }
  #thumb .t { position: absolute; left: 540px; transform: translateX(-50%); font: 700 150px/150px "SG"; letter-spacing: -0.045em; white-space: nowrap; }
  #th1 { top: 300px; color: var(--mintw); }
  #th2 { top: 470px; background: var(--hero); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 10px; }
  #thLogo { position: absolute; left: 540px; top: 1560px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; }
  #thLogo img { width: 124px; height: 72px; }
  #thLogo span { font: 700 76px/86px "SG"; letter-spacing: -0.04em; background: linear-gradient(135deg, #7FE7DC, #316879); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="hud">
  <div class="big" id="lWe">WE</div>
  <div class="big" id="lYou">YOU</div>
  <div class="big sm" id="lReal">A REAL STEP</div>
  <div class="big sm" id="lBusy">NOT BUSYWORK</div>
  <div id="lockup">Werbens</div>
  <div id="tagline">Decoding how brands sell</div>
  <div id="cap"></div>
</div>
<div id="thumb">
  <div class="t" id="th1">SAME BOX.</div>
  <div class="t" id="th2">PAY MORE?</div>
  <div id="thLogo"><img src="/assets/brand/app-werbens-logo.svg" alt=""><span>Werbens</span></div>
</div>
<script type="module" src="/src/scene.js"></script>
</body>
</html>
