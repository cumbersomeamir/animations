<!doctype html>
<html><head><meta charset="utf-8"><title>Courtlens 30s — Hindi episode 03 (call recording)</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script>
<script>
(async () => {
  const faces = [
    ['fonts/Inter-Medium.otf', { weight: '500' }], ['fonts/Inter-SemiBold.otf', { weight: '600' }],
    ['fonts/Inter-Bold.otf', { weight: '700' }], ['fonts/Inter-ExtraBold.otf', { weight: '800' }],
    ['fonts/Inter-Black.otf', { weight: '900' }], ['fonts/Inter-MediumItalic.otf', { weight: '500', style: 'italic' }],
  ];
  const deva = [['500', 'NotoSansDevanagari-500'], ['600', 'NotoSansDevanagari-600'], ['700', 'NotoSansDevanagari-700'],
                ['800', 'NotoSansDevanagari-800'], ['900', 'NotoSansDevanagari-800']];   // Hindi glyphs (OFL), fallback after Inter
  for (const [wgt, f] of deva) { const ff = new FontFace('Noto Sans Devanagari', `url(fonts/${f}.woff2)`, { weight: wgt }); await ff.load(); document.fonts.add(ff); }
  for (const [u, d] of faces) { const ff = new FontFace('Inter', `url(${u})`, d); await ff.load(); document.fonts.add(ff); }
  const tl = await (await fetch('timeline.json')).json();
  const img = new Image(); img.src = 'icon.png'; await img.decode();
  window.SCENE.init(tl, img);
  const ctx = document.getElementById('c').getContext('2d');
  window.renderAt = (t) => { window.SCENE.render(ctx, t); return true; };
  const q = new URLSearchParams(location.search);
  if (q.has('t')) window.renderAt(parseFloat(q.get('t')));
  window.READY = true;
})().catch(e => { window.RENDER_ERROR = String(e && e.stack || e); });
</script></body></html>
