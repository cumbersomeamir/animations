// Help english-10 (2026-11-09) — accepted format 'Hands That Reveal the Hidden Cost'; primitives reused unchanged; English narration/captions (Inter) — original Canvas2D shadow-puppet theatre (art direction: lemo-opuscar styles/shadow-puppet/STYLE.md,
// read-only). Deterministic: window.__draw(frame) -> PNG. Puppets step at 15 fps, snow/effects at 12 fps, delivery 30 fps.
const W = 1080, H = 1920;
const P = { cream: '#F7F5EF', ink: '#0B0D12', green: '#2DB37D', greenDk: '#1F8A5E', yellow: '#F2C230', yellowDk: '#C99A12', glow: '#FFE7A8' };
const CUE = await (await fetch('./cues.json')).json(); const C = CUE.cues;
const CAP = await (await fetch('./captions.json')).json();
await document.fonts.load('800 60px Inter, "Noto Sans Devanagari"'); await document.fonts.load('600 30px Inter, "Noto Sans Devanagari"'); for (const w of [600, 700, 800]) await document.fonts.load(`${w} 60px "Noto Sans Devanagari"`, 'आपदा राहत');
const icon_img = new Image(); icon_img.src = '/assets/icon.png'; await icon_img.decode();
const cv = document.getElementById('c'); const g = cv.getContext('2d');
const SCR = { x: 64, y: 560, w: 952, h: 1080 }, GROUND = 1500, CX = 540, CY = 1100;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };

// ---------- cached textures (built once) ----------
const weave = mk(SCR.w, SCR.h, (w, cw, ch) => { w.fillStyle = '#F4E8CF'; w.fillRect(0, 0, cw, ch);
  for (let y = 0; y < ch; y += 3) { w.fillStyle = `rgba(150,110,60,${0.035 + 0.03 * rnd(y)})`; w.fillRect(0, y, cw, 1); }
  for (let x = 0; x < cw; x += 3) { w.fillStyle = `rgba(150,110,60,${0.03 + 0.03 * rnd(x + 9)})`; w.fillRect(x, 0, 1, ch); }
  for (let i = 0; i < 3000; i++) { w.fillStyle = `rgba(120,80,40,${0.05 * rnd(i)})`; w.fillRect(rnd(i * 3) * cw, rnd(i * 7) * ch, 2, 1); }
  const e = w.createRadialGradient(cw / 2, ch / 2, ch * 0.3, cw / 2, ch / 2, ch * 0.75); e.addColorStop(0, 'rgba(90,50,20,0)'); e.addColorStop(1, 'rgba(90,50,20,0.28)'); w.fillStyle = e; w.fillRect(0, 0, cw, ch); });
const hide = g.createPattern(mk(128, 128, (w) => { w.fillStyle = '#fff'; w.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 260; i++) { w.fillStyle = `rgba(110,70,30,${0.06 + 0.1 * rnd(i + 3)})`; w.beginPath(); w.ellipse(rnd(i) * 128, rnd(i + 50) * 128, 2 + 9 * rnd(i + 7), 1 + 4 * rnd(i + 9), rnd(i + 11) * 3, 0, 7); w.fill(); }
  for (let i = 0; i < 60; i++) { w.strokeStyle = `rgba(90,55,20,${0.08 * rnd(i + 40)})`; w.beginPath(); const x = rnd(i + 70) * 128, y = rnd(i + 90) * 128; w.moveTo(x, y); w.lineTo(x + 20 * rnd(i + 2), y + 6 * rnd(i + 4)); w.stroke(); } }), 'repeat');
const lattice = g.createPattern(mk(44, 44, (w) => { w.fillStyle = 'rgba(255,240,200,0.9)';
  w.beginPath(); w.moveTo(22, 6); w.lineTo(34, 22); w.lineTo(22, 38); w.lineTo(10, 22); w.closePath(); w.fill();
  w.beginPath(); w.arc(0, 0, 5, 0, 7); w.arc(44, 0, 5, 0, 7); w.arc(0, 44, 5, 0, 7); w.arc(44, 44, 5, 0, 7); w.fill();
  w.fillStyle = 'rgba(40,25,10,1)'; w.fillRect(19, 19, 6, 6); }), 'repeat');
const grains = [0, 1, 2].map((k) => mk(W, H, (w) => { for (let i = 0; i < 9000; i++) { w.fillStyle = rnd(i + k * 9999) > 0.5 ? 'rgba(255,240,210,0.05)' : 'rgba(40,20,0,0.05)'; w.fillRect(rnd(i * 1.3 + k) * W, rnd(i * 2.7 + k) * H, 2, 2); } }));

// ---------- puppet primitives ----------
function piece(path, fill, alpha = 0.84, outline = '#123F2C', carve = false, blur = 0) {
  g.save(); if (blur) g.filter = `blur(${blur}px)`;
  g.save(); g.globalAlpha = 0.16; g.translate(9, 11); g.filter = `blur(${6 + blur}px)`; g.fillStyle = '#3A2410'; g.fill(path); g.restore();
  g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = alpha; g.fillStyle = fill; g.fill(path);
  g.globalAlpha = 0.55; g.fillStyle = hide; g.fill(path); g.restore();
  if (carve) { g.save(); g.clip(path); g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.55; g.fillStyle = lattice; g.fillRect(carve[0], carve[1], carve[2], carve[3]); g.restore(); }
  g.save(); g.lineWidth = 5; g.strokeStyle = outline; g.globalAlpha = 0.92; g.lineJoin = 'round'; g.stroke(path); g.restore();
  g.restore();
}
function rivet(x, y) { g.fillStyle = P.yellowDk; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); g.fillStyle = '#FFE9A0'; g.beginPath(); g.arc(x - 2, y - 2, 2.5, 0, 7); g.fill(); }
let ROD_END = SCR.y + SCR.h + 60;
function rod(x, y) { g.save(); g.strokeStyle = 'rgba(70,60,50,0.36)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (x - W / 2) * 0.07, ROD_END); g.stroke(); g.restore(); }
function ik(sx, sy, tx, ty, l1, l2, bend) { let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy); const m = (l1 + l2) * 0.999; if (d > m) { tx = sx + dx / d * m; ty = sy + dy / d * m; d = m; }
  const a = Math.atan2(ty - sy, tx - sx), cA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1), ang = a + bend * Math.acos(cA); return [sx + Math.cos(ang) * l1, sy + Math.sin(ang) * l1, tx, ty]; }
function limb(x0, y0, x1, y1, w0, w1) { const a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a), ny = Math.cos(a), p = new Path2D();
  p.moveTo(x0 + nx * w0, y0 + ny * w0); p.lineTo(x1 + nx * w1, y1 + ny * w1); p.arc(x1, y1, w1, a + Math.PI / 2, a - Math.PI / 2, true); p.lineTo(x0 - nx * w0, y0 - ny * w0); p.arc(x0, y0, w0, a - Math.PI / 2, a + Math.PI / 2, true); return p; }

// profile head with open-cut face (sympathetic figures)
function head(x, y, s, wear, wearFill, tilt) {
  g.save(); g.translate(x, y + 50); g.rotate(tilt); g.translate(-x, -(y + 50));
  const p = new Path2D(); p.ellipse(x, y, 70, 80, 0, 0, Math.PI * 2);
  p.moveTo(x + 62 * s, y - 6); p.lineTo(x + 92 * s, y + 14); p.lineTo(x + 66 * s, y + 24);   // nose
  piece(p, '#D9B98A', 0.5, '#5A3A1A');
  g.save(); g.globalCompositeOperation = 'screen'; g.fillStyle = 'rgba(255,240,200,0.85)';
  g.beginPath(); g.ellipse(x + 34 * s, y - 6, 15, 6, 0.15 * s, 0, 7); g.fill(); g.restore();          // almond eye cut
  g.strokeStyle = 'rgba(90,58,26,0.9)'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + 18 * s, y - 24); g.quadraticCurveTo(x + 36 * s, y - 32, x + 52 * s, y - 24); g.stroke();   // brow
  g.beginPath(); g.moveTo(x + 46 * s, y + 42); g.quadraticCurveTo(x + 58 * s, y + 48, x + 66 * s, y + 40); g.stroke();   // calm mouth
  piece(wear(x, y, s), wearFill, 0.88, '#5A3A10', [x - 120, y - 140, 240, 70]);
  g.restore();
}
const hat = (x, y, s) => { const p = new Path2D(); p.ellipse(x - 2 * s, y - 52, 76, 40, 0, Math.PI, 0); p.moveTo(x - 125, y - 50); p.quadraticCurveTo(x, y - 74, x + 125, y - 50); p.quadraticCurveTo(x, y - 34, x - 125, y - 50); return p; };
const scarf = (x, y, s) => { const p = new Path2D(); p.ellipse(x - 8 * s, y - 8, 84, 92, 0, Math.PI * 0.92, Math.PI * 0.08); p.lineTo(x - 30 * s, y + 70); p.lineTo(x - 95 * s, y + 55); p.closePath(); return p; };

// figure in profile: { x, dir, tilt, head, hand, back, body, sleeve, wear, wearFill, tassel, blur }
function figure(f, t) {
  const s = f.dir, sh = { x: f.x + 10 * s, y: GROUND - 430 }, trem = Math.sin(t * 6.1 + f.x) * 1.8 + Math.sin(t * 2.3 + f.x) * 1.2;
  g.save(); g.translate(f.x, GROUND); g.rotate(f.tilt || 0); g.translate(-f.x, -GROUND);
  const robe = new Path2D(); robe.moveTo(f.x - 125, GROUND); robe.bezierCurveTo(f.x - 118, GROUND - 250, f.x - 82, GROUND - 420, f.x - 24, GROUND - 452);
  robe.lineTo(f.x + 38, GROUND - 452); robe.bezierCurveTo(f.x + 88, GROUND - 420, f.x + 115, GROUND - 250, f.x + 125, GROUND); robe.closePath();
  piece(robe, f.body, 0.84, '#123F2C', [f.x - 80, GROUND - 330, 160, 260], f.blur);
  const hem = new Path2D(); hem.moveTo(f.x - 125, GROUND); hem.quadraticCurveTo(f.x, GROUND - 46, f.x + 125, GROUND); hem.lineTo(f.x + 122, GROUND - 22); hem.quadraticCurveTo(f.x, GROUND - 70, f.x - 122, GROUND - 22); hem.closePath();
  piece(hem, P.greenDk, 0.8);
  // back arm
  const [bex, bey, bhx, bhy] = ik(sh.x - 12 * s, sh.y + 6, f.back[0], f.back[1] + trem, 118, 112, -s);
  piece(limb(sh.x - 12 * s, sh.y + 6, bex, bey, 24, 20), f.sleeve, 0.72); piece(limb(bex, bey, bhx, bhy, 20, 16), f.sleeve, 0.72); rivet(bex, bey);
  const hx = f.x + 18 * s, hy = GROUND - 548;
  piece(limb(hx, hy + 60, f.x + 10 * s, GROUND - 440, 22, 28), f.body, 0.78);
  const collar = new Path2D(); for (let i = 0; i < 5; i++) collar.arc(f.x - 40 + i * 20 + 6 * s, GROUND - 452, 14, Math.PI, 0); piece(collar, f.collar || P.yellow, 0.8, '#5A3A10');
  head(hx, hy, s, f.wear, f.wearFill, f.head || 0);
  if (f.tassel !== undefined) { const ax = hx - 60 * s, ay = hy + 40, tl = new Path2D(); const ex = ax + Math.sin(f.tassel) * 70, ey = ay + Math.cos(f.tassel) * 70;
    tl.moveTo(ax, ay); tl.lineTo(ex - 10, ey); tl.lineTo(ex + 10, ey); tl.closePath(); piece(tl, f.wearFill, 0.85, '#5A3A10'); rivet(ax, ay); }
  rivet(f.x + 10 * s, GROUND - 445);
  const [ex, ey, hx2, hy2] = ik(sh.x, sh.y, f.hand[0], f.hand[1] + trem, 122, 116, s);
  piece(limb(sh.x, sh.y, ex, ey, 26, 21), f.sleeve, 0.8); piece(limb(ex, ey, hx2, hy2, 21, 17), f.sleeve, 0.8);
  const hand = new Path2D(); hand.ellipse(hx2 + 8 * s, hy2, 22, 17, 0, 0, Math.PI * 2); piece(hand, '#D9B98A', 0.6, '#5A3A1A');
  rivet(sh.x, sh.y); rivet(ex, ey);
  g.restore();
  rod(hx2, hy2); rod(f.x + 10 * s, GROUND - 445);
  return { hand: [hx2, hy2], back: [bhx, bhy] };
}
function coat(x, y, sc, crisp = true, blur = 0) {
  const k = (v) => v * sc, p = new Path2D();
  p.moveTo(x - k(40), y); p.lineTo(x + k(40), y); p.lineTo(x + k(95), y + k(35)); p.lineTo(x + k(150), y + k(210)); p.lineTo(x + k(110), y + k(228));
  p.lineTo(x + k(78), y + k(130)); p.lineTo(x + k(88), y + k(380)); p.lineTo(x - k(88), y + k(380)); p.lineTo(x - k(78), y + k(130));
  p.lineTo(x - k(110), y + k(228)); p.lineTo(x - k(150), y + k(210)); p.lineTo(x - k(95), y + k(35)); p.closePath();
  piece(p, P.yellow, crisp ? 0.82 : 0.6, '#6B4A08', [x - k(70), y + k(150), k(140), k(200)], blur);
  g.save(); g.strokeStyle = 'rgba(107,74,8,0.85)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, y + k(20)); g.lineTo(x, y + k(375)); g.stroke(); g.restore();
  for (const yy of [110, 190, 270]) rivet(x + k(12), y + k(yy));
  rod(x + k(60), y + k(200));
}
function bag(x, y, dim, blur = 0) {
  const p = new Path2D(); p.moveTo(x - 110, y); p.bezierCurveTo(x - 150, y - 120, x - 90, y - 230, x - 30, y - 220); p.lineTo(x + 40, y - 225);
  p.bezierCurveTo(x + 100, y - 230, x + 150, y - 120, x + 110, y); p.closePath();
  // odd leftovers poking out: a lone sock, a tiny sweater sleeve, a sandal
  const sock = new Path2D(); sock.moveTo(x - 60, y - 210); sock.lineTo(x - 70, y - 300); sock.lineTo(x - 40, y - 300); sock.lineTo(x - 30, y - 250); sock.lineTo(x - 5, y - 245); sock.lineTo(x - 10, y - 215); sock.closePath();
  const slv = limb(x + 20, y - 215, x + 70, y - 300, 16, 12);
  const sandal = new Path2D(); sandal.ellipse(x + 95, y - 230, 40, 14, -0.6, 0, 7);
  g.save(); g.globalAlpha = 1 - 0.45 * dim;
  piece(sock, '#B9A27E', 0.7, '#4A3A20', false, blur); piece(slv, '#8FB7A3', 0.7, '#2E4A3A', false, blur); piece(sandal, '#A0805A', 0.7, '#4A3A20', false, blur);
  piece(p, '#9A8F7A', 0.85, '#3A3020', false, blur);
  g.restore(); rod(x, y - 100);
}
function plaque(x, y, w, h, label, sc, flip = 1, num = '') {
  if (sc <= 0.01) return;
  g.save(); g.translate(x, y); g.scale(sc * flip, sc);
  const p = new Path2D(); p.roundRect(-w / 2, -h / 2, w, h, 20); piece(p, '#2A1A10', 0.9, '#000');
  g.fillStyle = P.glow; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (label) { g.font = `800 ${Math.round(h * 0.36)}px Inter, "Noto Sans Devanagari"`; g.fillText(label, 0, 4); }
  else { g.font = `800 ${Math.round(h * 0.55)}px Inter, "Noto Sans Devanagari"`; g.fillText(num, 0, 6); }
  g.restore(); rod(x, y + h / 2 * sc);
}
function tickBadge(x, y, sc) { if (sc <= 0.01) return; g.save(); g.translate(x, y); g.scale(sc, sc);
  const p = new Path2D(); p.arc(0, 0, 34, 0, 7); piece(p, P.green, 0.92, '#0E4D33');
  g.strokeStyle = P.yellow; g.lineWidth = 10; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-15, 1); g.lineTo(-4, 13); g.lineTo(16, -12); g.stroke(); g.restore(); }
function ruler(x, top, sc) { if (sc <= 0.01) return; const h = (GROUND - top) * sc, y0 = GROUND - h, p = new Path2D(); p.rect(x - 18, y0, 36, h);
  piece(p, P.yellow, 0.75, '#6B4A08'); g.save(); g.strokeStyle = 'rgba(80,50,10,0.9)'; g.lineWidth = 3;
  for (let yy = GROUND - 40; yy > y0 + 10; yy -= 40) { g.beginPath(); g.moveTo(x - 18, yy); g.lineTo(x + (yy % 80 === 0 ? 4 : -6), yy); g.stroke(); } g.restore(); rod(x, GROUND - 200); }
function flake(x, y, r, rot) { const p = new Path2D(); for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3; p.moveTo(x, y); p.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.save(); g.strokeStyle = 'rgba(40,60,70,0.55)'; g.lineWidth = 5; g.lineCap = 'round'; g.stroke(p); g.strokeStyle = 'rgba(255,248,230,0.9)'; g.lineWidth = 2; g.stroke(p); g.restore(); }

// ---------- scene: "Hands That Reveal the Hidden Cost" (poverty premium — small pack vs bulk sack) ----------
const SCN = CUE.scenes, SA = Object.values(SCN);
const span = (k) => SCN[k];
function dip(t) { let d = 0; for (const [a] of SA.slice(1)) d = Math.max(d, 1 - Math.min(1, Math.abs(t - a) / 0.22)); return d; }   // lamp dip at each scene change
const sm = (u) => u * u * (3 - 2 * u);
const inOut = (t, a, b, f = 0.35) => Math.min(sm(seg(t, a, a + f)), 1 - sm(seg(t, b - f, b)));

// cutout hand on a sleeve (one path => one carved piece); pose: open | grip | point
function hand(x, y, ang, s, pose, sleeve, cuff, blur = 0) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  const arm = new Path2D(); arm.moveTo(-34, 40); arm.lineTo(-48, 900); arm.lineTo(48, 900); arm.lineTo(34, 40); arm.closePath();
  piece(arm, sleeve, 0.82, '#123F2C', [-30, 120, 60, 500], blur);
  const cf = new Path2D(); cf.roundRect(-44, 26, 88, 34, 10); piece(cf, cuff, 0.9, '#5A3A10', false, blur);
  const p = new Path2D(); p.roundRect(-40, -46, 80, 86, 24);
  const fing = pose === 'grip' ? [[-27, 30, -0.1], [-9, 34, -0.02], [9, 33, 0.02], [26, 26, 0.1]] : pose === 'point' ? [[-27, 26, -0.1], [-9, 92, 0], [9, 28, 0.02], [26, 24, 0.1]] : [[-27, 66, -0.14], [-9, 76, -0.04], [9, 72, 0.04], [26, 58, 0.14]];
  for (const [fx, len, a] of fing) { const ex = fx + Math.sin(a) * len, ey = -40 - Math.cos(a) * len; const f = limb(fx, -38, ex, ey, 10.5, 9.5); p.addPath(f); }
  p.addPath(limb(-38, 6, pose === 'open' ? -84 : -66, pose === 'open' ? -34 : -26, 12, 10));
  piece(p, '#D9B98A', 0.62, '#5A3A1A', false, blur);
  rivet(0, 44); g.restore();
  rod(x - Math.sin(ang) * -40 * s, y + 40 * s);
}
function packet(x, y, s, dim = 0, blur = 0) {   // small grocery packet (bottom-centre at x,y)
  g.save(); g.globalAlpha = 1 - 0.4 * dim; const w = 96 * s, h = 132 * s;
  const p = new Path2D(); p.moveTo(x - w / 2, y); p.lineTo(x - w / 2, y - h + 22 * s); p.lineTo(x - w / 2 + 10 * s, y - h); p.lineTo(x + w / 2 - 10 * s, y - h); p.lineTo(x + w / 2, y - h + 22 * s); p.lineTo(x + w / 2, y); p.closePath();
  piece(p, P.yellow, 0.88, '#6B4A08', false, blur);
  const lab = new Path2D(); lab.roundRect(x - w * 0.36, y - h * 0.62, w * 0.72, h * 0.42, 8 * s); piece(lab, P.cream, 0.9, '#6B4A08', false, blur);
  g.fillStyle = '#6B4A08'; for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(x - w * 0.18 + (i % 3) * w * 0.18, y - h * 0.47 + Math.floor(i / 3) * h * 0.13, 6 * s, 9 * s, 0.5, 0, 7); g.fill(); }
  g.restore();
}
function sack(x, y, s, dim = 0, blur = 0) {     // bulk sack (bottom-centre at x,y)
  g.save(); g.globalAlpha = 1 - 0.45 * dim; const w = 230 * s, h = 300 * s;
  const p = new Path2D(); p.moveTo(x - w / 2, y); p.bezierCurveTo(x - w * 0.62, y - h * 0.45, x - w * 0.42, y - h * 0.86, x - w * 0.16, y - h * 0.9);
  p.lineTo(x - w * 0.22, y - h); p.lineTo(x + w * 0.22, y - h); p.lineTo(x + w * 0.16, y - h * 0.9);
  p.bezierCurveTo(x + w * 0.42, y - h * 0.86, x + w * 0.62, y - h * 0.45, x + w / 2, y); p.closePath();
  piece(p, '#C9A06A', 0.86, '#4A3216', [x - w * 0.34, y - h * 0.7, w * 0.68, h * 0.55], blur);
  const tie = new Path2D(); tie.roundRect(x - w * 0.2, y - h * 0.93, w * 0.4, 16 * s, 6); piece(tie, P.greenDk, 0.9, '#0E4D33', false, blur);
  const lab = new Path2D(); lab.roundRect(x - w * 0.26, y - h * 0.5, w * 0.52, h * 0.26, 10 * s); piece(lab, P.cream, 0.92, '#4A3216', false, blur);
  g.fillStyle = '#4A3216'; for (let i = 0; i < 7; i++) { g.beginPath(); g.ellipse(x - w * 0.15 + (i % 4) * w * 0.1, y - h * 0.41 + Math.floor(i / 4) * h * 0.09, 6 * s, 9 * s, 0.5, 0, 7); g.fill(); }
  g.restore();
}
