<script type="module">
// WastePaisa hindi-03 episode 01 "पुराने एल्युमिनियम से छोटा कारोबार" (a small aluminium scrap aggregation business), Hindi.
// Accepted 'Scrap Shop X-ray' renderer copied from 2026-11-03-round-02/src/scene.html, kept as-is (point-cloud shop,
// camera grammar, mascot, caption panel, recap and CTA layout). New: aluminium props and scene functions, Devanagari
// Baloo 2 faces (same family, OFL), Hindi caption groups and Hindi line spacing (84 px) so matras never collide.
// Every frame is a pure function of t.
const W = 1080, H = 1920, BASE = '/production/30s/2026-11-03-hindi-03';
const cv = document.getElementById('c'); const g = cv.getContext('2d');
const C = { bg: '#07090b', dot: '233,241,242', cyan: '143,211,224', warm: '#f46d12', warmRGB: '244,109,18', cream: '#fef7ee', green: '#1a6535', ink: '#1d130e',
  tin: '#c4c9cf', tinLight: '#dde1e5', tinDark: '#959ca4', copper: '#d9822b', copperDark: '#a85a1c', alu: '#cfd4da', aluDark: '#8f969e', glove: '#ee7a1e',
  sheath: '#3a4048', panel: 'rgba(8,10,12,0.74)' };
const timing = await (await fetch(`${BASE}/audio/narration/timing.json`)).json();
const icon = new Image(); icon.src = '/assets/icon.png'; await icon.decode();
await document.fonts.load('800 58px "Baloo 2"'); await document.fonts.load('700 30px "Baloo 2"');
await document.fonts.load('800 62px "Baloo 2"', 'कबाड़ ₹'); await document.fonts.load('700 40px "Baloo 2"', 'कबाड़ ₹');
if (!document.fonts.check('800 62px "Baloo 2"', 'कबाड़') || !document.fonts.check('700 40px "Baloo 2"', 'कबाड़')) throw new Error('Devanagari Baloo 2 face not loaded');

// ---------- helpers ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (k) => k * k * (3 - 2 * k);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const s = 1.6; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function textC(s, x, y, size, col, weight = 800) { g.font = `${weight} ${size}px "Baloo 2"`; g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y); }
function label(s, x, y, a, o = {}) { // short readable label on a dark chip, optional leader line to a point
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `700 ${o.size || 32}px "Baloo 2"`; const w = g.measureText(s).width + 36, h = (o.size || 32) + 20;
  if (o.to) { g.strokeStyle = o.warm ? C.warm : 'rgba(254,247,238,0.8)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(o.to[0], o.to[1]); g.stroke(); g.beginPath(); g.arc(o.to[0], o.to[1], 7, 0, 7); g.fillStyle = o.warm ? C.warm : C.cream; g.fill(); }
  rr(x - w / 2, y - h / 2, w, h, h / 2); g.fillStyle = o.warm ? C.warm : 'rgba(18,22,26,0.92)'; g.fill(); g.strokeStyle = o.warm ? C.warm : 'rgba(254,247,238,0.35)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = o.warm ? '#1d130e' : C.cream; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y + 2); g.restore();
}

// ---------- point-cloud scrap shop (world space, seeded once, never re-randomised) ----------
const PTS = [];
function line3(a, b, step, warm = false, cyan = false) { const d = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]); const n = Math.max(2, Math.round(d / step));
  for (let i = 0; i <= n; i++) { const u = i / n; PTS.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, warm ? 2 : cyan ? 1 : 0]); } }

  [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].forEach(([i, j]) => line3(P[i], P[j], step, warm, cyan)); }

(() => {
  const S = 0.075;
  for (let x = -4.5; x <= 4.5; x += 1.0) line3([x, 0, -1.5], [x, 0, -9], S * 1.4); // floor plan grid
  for (let z = -1.5; z >= -9; z -= 1.0) line3([-4.5, 0, z], [4.5, 0, z], S * 1.4);
  box3(-4.5, 0, -9, 4.5, 3.4, -9, S); // back wall outline
  for (const side of [-1, 1]) { const xa = side * 1.7, xb = side * 4.2; // shelving units with scrap on them
    for (const y of [0.05, 0.75, 1.45, 2.15, 2.85]) line3([Math.min(xa, xb), y, -7.6], [Math.max(xa, xb), y, -7.6], S), line3([Math.min(xa, xb), y, -6.9], [Math.max(xa, xb), y, -6.9], S);
    for (const x of [xa, (xa + xb) / 2, xb]) line3([x, 0, -7.6], [x, 2.85, -7.6], S), line3([x, 0, -6.9], [x, 2.85, -6.9], S);
    const r = rng(side > 0 ? 7 : 9);
    for (const y of [0.05, 0.75, 1.45, 2.15]) for (let i = 0; i < 3; i++) { const x = Math.min(xa, xb) + 0.4 + i * 0.8 + r() * 0.2;
      if (r() < 0.5) coil3(x, y + 0.28, -7.25, 0.24, S * 0.8); else box3(x - 0.25, y, -7.5, x + 0.25, y + 0.45, -7.0, S); } }
  box3(-2.3, 0, -3.6, 2.3, 1.0, -2.6, S * 0.9); // the X-ray counter (warm top edge = the small accent)
  line3([-2.3, 1.0, -2.6], [2.3, 1.0, -2.6], S * 0.5, true); line3([-2.3, 1.0, -3.6], [2.3, 1.0, -3.6], S * 0.5, true);
  box3(-0.4, 3.0, -4.6, 0.4, 3.1, -4.2, S * 0.6, true); // hanging scan lamp
})();
const CAM = [[0, [0, 1.95, 3.6]], [3.5, [0, 1.6, 2.4]], [7.65, [0.25, 1.5, 2.0]], [12.1, [0, 1.85, 3.1]], [17.45, [-0.3, 1.7, 2.6]], [21.5, [0, 2.35, 3.7]], [25.9, [0, 2.05, 5.0]], [30, [0, 2.05, 5.5]]]; // same moves, re-timed to this episode's scenes
function camAt(t) { for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) { const [ta, a] = CAM[i - 1], [tb, b] = CAM[i]; const k = ease(clamp((t - ta) / (tb - ta))); return a.map((v, j) => lerp(v, b[j], k)); } return CAM[CAM.length - 1][1]; }
function pointCloud(t, dim) {
  const [cx, cy, cz] = camAt(t), f = 1050;

  for (const [x, y, z, k] of PTS) {

    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const a = clamp(3.4 / d, 0.24, 0.85) * dim, r = clamp(4.2 / d + 0.9, 1.2, 2.7);
    g.fillStyle = k === 2 ? `rgba(${C.warmRGB},${Math.min(1, a * 1.6)})` : k === 1 ? `rgba(${C.cyan},${a})` : `rgba(${C.dot},${a * 0.8})`;
    g.beginPath(); g.arc(sx, sy, r, 0, 6.283); g.fill();

}

// ---------- the accepted simplified open-lid can mascot (cylinder, lid, two eyes, two arms) ----------
function mascot(x, base, s, p) {

  const shoulder = (side) => [X + side * bw / 2, top + bh * 0.56];
  const hand = (side, a) => { const [sx, sy] = shoulder(side); return [sx + Math.cos(a[0]) * a[1] * s * side, sy + Math.sin(a[0]) * a[1] * s]; };
  const arm = (side, a, white) => { const [sx, sy] = shoulder(side), [hx, hy] = hand(side, a); g.beginPath(); g.moveTo(sx, sy);
    g.quadraticCurveTo(sx + side * 40 * s, (sy + hy) / 2 + 30 * s, hx, hy); g.strokeStyle = white ? '#fff6e8' : '#c47a42'; g.lineWidth = (white ? 24 : 11) * s; g.lineCap = 'round'; g.stroke();
    g.beginPath(); g.arc(hx, hy, (white ? 25 : 17) * s, 0, 7); g.fillStyle = white ? '#fff6e8' : C.glove; g.fill(); };

    if (!white) { g.strokeStyle = C.tinDark; g.lineWidth = 6 * s; g.stroke(); } g.restore(); };
  g.save(); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowOffsetY = 14 * s; g.shadowBlur = 24 * s;
  drawLid(true); arm(-1, p.armR, true); arm(1, p.armL, true); rr(X - bw / 2 - 10 * s, top - 14 * s, bw + 20 * s, bh + 24 * s, 26 * s); g.fillStyle = '#fff6e8'; g.fill();
  g.shadowColor = 'transparent'; drawLid(false);
  rr(X - bw / 2, top, bw, bh, 18 * s); g.fillStyle = C.tin; g.fill();
  g.fillStyle = C.tinLight; g.fillRect(X - bw / 2 + 12 * s, top + 6 * s, 22 * s, bh - 12 * s); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(X + bw / 2 - 30 * s, top + 6 * s, 22 * s, bh - 12 * s);
  g.beginPath(); g.ellipse(X, top + 3 * s, bw / 2 - 4 * s, 13 * s, 0, 0, 7); g.fillStyle = C.tinDark; g.fill(); g.beginPath(); g.ellipse(X, top + 5 * s, bw / 2 - 16 * s, 8 * s, 0, 0, 7); g.fillStyle = '#5c6168'; g.fill();
  const ly = top + bh * 0.52; g.fillStyle = C.cream; g.fillRect(X - bw / 2, ly, bw, bh * 0.34); g.fillStyle = C.warm; g.fillRect(X - bw / 2, ly, bw, 10 * s); g.fillStyle = C.green; g.fillRect(X - bw / 2, ly + bh * 0.34 - 7 * s, bw, 7 * s);
  for (const side of [-1, 1]) { const ex = X + side * bw * 0.22, ey = top + bh * 0.3; g.beginPath(); g.ellipse(ex, ey, 27 * s, 30 * s, 0, 0, 7); g.fillStyle = '#fffaf0'; g.fill();
    const [lx, lyy] = p.look || [0, 0]; g.beginPath(); g.arc(ex + lx * 9 * s, ey + lyy * 9 * s, 12 * s, 0, 7); g.fillStyle = C.ink; g.fill(); g.beginPath(); g.arc(ex + lx * 9 * s + 4 * s, ey + lyy * 9 * s - 5 * s, 3.5 * s, 0, 7); g.fillStyle = '#fff'; g.fill();
    if (p.blink) { g.fillStyle = C.tin; g.fillRect(ex - 30 * s, ey - 32 * s, 60 * s, 62 * s * p.blink); }
    if (p.stern) { g.strokeStyle = C.ink; g.lineWidth = 6 * s; g.beginPath(); g.moveTo(ex - 22 * s, ey - 38 * s - side * 6 * s); g.lineTo(ex + 22 * s, ey - 38 * s + side * 6 * s); g.stroke(); } }
  arm(-1, p.armR, false); arm(1, p.armL, false);

}

// ---------- aluminium-business props (solid foreground objects) with X-ray reveal ----------
const AL = { alu: '#cfd4da', aluHi: '#eef1f4', aluDark: '#8f969e', grime: '#5f584b', iron: '#6b6f74', ironDark: '#3c4045', plastic: '#2b2f36', dirt: '#6e4b2a', dirtHi: '#8a6238', jute: '#a8814f', juteDark: '#7a5a33' };
function xrayClip(x0, y0, x1, y1, reveal, draw) { // draw() inside the part of the box the scan has passed, plus scan bar
  if (reveal <= 0) return; const rx = x0 + (x1 - x0) * reveal; g.save(); g.beginPath(); g.rect(x0, y0, rx - x0, y1 - y0); g.clip(); draw(); g.restore();
  if (reveal < 1) { g.fillStyle = 'rgba(143,211,224,0.35)'; g.fillRect(rx - 10, y0, 20, y1 - y0); g.fillStyle = 'rgba(200,240,250,0.95)'; g.fillRect(rx - 2, y0, 4, y1 - y0); }
}
function potShape(x, y, s, col, hi, dent) { // an old aluminium cooking pot (degchi): rim, tapered body, two side handles, a dent
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 16; g.lineCap = 'round';
  g.beginPath(); g.arc(-122, -28, 24, Math.PI * 0.5, Math.PI * 1.5); g.stroke(); g.beginPath(); g.arc(122, -28, 24, -Math.PI * 0.5, Math.PI * 0.5); g.stroke();
  g.beginPath(); g.moveTo(-108, -58); g.lineTo(108, -58); g.quadraticCurveTo(116, 46, 86, 84); g.lineTo(-86, 84); g.quadraticCurveTo(-116, 46, -108, -58); g.closePath(); g.fill();
  rr(-124, -78, 248, 28, 14); g.fill();
  g.fillStyle = hi; g.fillRect(-80, -44, 16, 106); g.fillRect(-112, -74, 120, 7);
  g.fillStyle = dent; g.beginPath(); g.ellipse(42, 14, 30, 15, 0.35, 0, 7); g.fill(); g.restore();
}
function pot(x, y, s, clean = 0, reveal = 0) { // grimy pot; `clean` fades the grime, `reveal` is an X-ray scan to bright metal
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20; potShape(x, y, s, AL.grime, 'rgba(255,255,255,0.10)', 'rgba(0,0,0,0.25)'); g.restore();
  if (clean > 0) { g.save(); g.globalAlpha *= clean; potShape(x, y, s, AL.alu, AL.aluHi, 'rgba(0,0,0,0.16)'); g.restore(); }

}
function frameShape(x, y, s, gasket = 1, screws = 1) { // a window-frame corner offcut: L-shaped extrusion, rubber/plastic gasket, steel screws
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = AL.alu; rr(-120, -20, 240, 40, 6); g.fill(); rr(-120, -20, 40, 190, 6); g.fill();
  g.fillStyle = AL.aluDark; g.fillRect(-108, -4, 224, 6); g.fillRect(-104, 0, 6, 160); g.fillStyle = AL.aluHi; g.fillRect(-114, -16, 228, 5);

  g.restore();
}
function screwsIcon(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); for (const [dx, r] of [[-22, 0.4], [22, -0.3]]) { g.save(); g.translate(dx, 0); g.rotate(r);
  g.fillStyle = AL.iron; g.fillRect(-5, -6, 10, 44); g.beginPath(); g.arc(0, -10, 14, 0, 7); g.fill(); g.strokeStyle = AL.ironDark; g.lineWidth = 4; g.beginPath(); g.moveTo(-8, -10); g.lineTo(8, -10); g.stroke(); g.restore(); } g.restore(); }
function gasketIcon(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = AL.plastic; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(-50, -14); g.quadraticCurveTo(0, 26, 50, -10); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3; g.beginPath(); g.moveTo(-44, -16); g.quadraticCurveTo(0, 20, 44, -12); g.stroke(); g.restore(); }
function dirtIcon(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = AL.dirt; g.beginPath(); g.ellipse(0, 10, 54, 22, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(-8, -2, 30, 18, 0, 0, 7); g.fill();
  g.fillStyle = AL.dirtHi; const r = rng(31); for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(-40 + r() * 80, -4 + r() * 24, 3 + r() * 3, 0, 7); g.fill(); } g.restore(); }
function sack(x, y, s = 1) { // jute sack of mixed scrap with a frame corner and a pot handle poking out
  g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20;
  g.fillStyle = AL.alu; g.fillRect(-30, -140, 18, 70); g.fillStyle = AL.grime; g.beginPath(); g.arc(40, -96, 34, Math.PI, 0); g.fill();
  g.fillStyle = AL.jute; g.beginPath(); g.moveTo(-96, -96); g.quadraticCurveTo(0, -126, 96, -96); g.quadraticCurveTo(126, 20, 92, 96); g.lineTo(-92, 96); g.quadraticCurveTo(-126, 20, -96, -96); g.closePath(); g.fill(); g.shadowColor = 'transparent';
  g.strokeStyle = AL.juteDark; g.lineWidth = 3; for (let i = -70; i <= 70; i += 20) { g.beginPath(); g.moveTo(i, -100); g.lineTo(i * 1.12, 92); g.stroke(); } g.restore(); }
function bale(x, y, w, h, n = 3) { // a strapped stack of clean, sorted aluminium (n slabs visible)
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20; const sh = h / 3;
  for (let i = 0; i < n; i++) { const yy = y - (i + 1) * sh; rr(x - w / 2, yy, w, sh - 4, 8); g.fillStyle = i % 2 ? AL.alu : '#c3c9d0'; g.fill(); if (i === 0) g.shadowColor = 'transparent';
    g.fillStyle = AL.aluHi; g.fillRect(x - w / 2 + 10, yy + 6, w - 20, 5); g.fillStyle = 'rgba(0,0,0,0.12)'; for (let k = -2; k <= 2; k++) g.fillRect(x + k * w / 6 - 2, yy + 14, 4, sh - 22); }
  if (n >= 3) { g.fillStyle = C.warm; g.fillRect(x - w / 2 - 4, y - h * 0.72, w + 8, 9); g.fillRect(x - w / 2 - 4, y - h * 0.3, w + 8, 9); }
  g.restore(); }
function scaleBase(x, y, w) { g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 10; g.shadowBlur = 18; rr(x - w / 2, y, w, 34, 8); g.fillStyle = '#59616b'; g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#7d8790'; g.fillRect(x - w / 2, y, w, 8); g.restore(); }
