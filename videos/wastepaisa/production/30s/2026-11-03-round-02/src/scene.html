<script type="module">
// WastePaisa round-02 episode 01 "The valuable metal hiding in old taps and door handles: brass scrap".
// Accepted 'Scrap Shop X-ray' renderer from 2026-11-02-feedback-round/src/scene.html, kept as-is (point-cloud shop,
// camera, mascot, caption treatment, recap and CTA); only the props and scene functions are new.
// Every frame is a pure function of t.
const W = 1080, H = 1920, BASE = '/production/30s/2026-11-03-round-02';
const cv = document.getElementById('c'); const g = cv.getContext('2d');
const C = { bg: '#07090b', dot: '233,241,242', cyan: '143,211,224', warm: '#f46d12', warmRGB: '244,109,18', cream: '#fef7ee', green: '#1a6535', ink: '#1d130e',
  tin: '#c4c9cf', tinLight: '#dde1e5', tinDark: '#959ca4', copper: '#d9822b', copperDark: '#a85a1c', alu: '#cfd4da', aluDark: '#8f969e', glove: '#ee7a1e',
  sheath: '#3a4048', panel: 'rgba(8,10,12,0.74)' };
const timing = await (await fetch(`${BASE}/audio/narration/timing.json`)).json();
const icon = new Image(); icon.src = '/assets/icon.png'; await icon.decode();
await document.fonts.load('800 58px "Baloo 2"'); await document.fonts.load('700 30px "Baloo 2"');

// ---------- helpers ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (k) => k * k * (3 - 2 * k);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const s = 1.6; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function textC(s, x, y, size, col, weight = 800) { g.font = `${weight} ${size}px "Baloo 2"`; g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y); }
function label(s, x, y, a, o = {}) { // short readable label on a dark chip, optional leader line to a point
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `700 ${o.size || 32}px "Baloo 2"`; const w = g.measureText(s).width + 36, h = (o.size || 32) + 20;
  if (o.to) { g.strokeStyle = o.warm ? C.warm : 'rgba(254,247,238,0.8)'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(o.to[0], o.to[1]); g.stroke(); g.beginPath(); g.arc(o.to[0], o.to[1], 7, 0, 7); g.fillStyle = o.warm ? C.warm : C.cream; g.fill(); }
  rr(x - w / 2, y - h / 2, w, h, h / 2); g.fillStyle = o.warm ? C.warm : 'rgba(18,22,26,0.92)'; g.fill(); g.strokeStyle = o.warm ? C.warm : 'rgba(254,247,238,0.35)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = o.warm ? '#1d130e' : C.cream; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y + 2); g.restore();
}

// ---------- point-cloud scrap shop (world space, seeded once, never re-randomised) ----------
const PTS = [];
function line3(a, b, step, warm = false, cyan = false) { const d = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]); const n = Math.max(2, Math.round(d / step));
  for (let i = 0; i <= n; i++) { const u = i / n; PTS.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, warm ? 2 : cyan ? 1 : 0]); } }
function box3(x0, y0, z0, x1, y1, z1, step, warm, cyan) { const P = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
  [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].forEach(([i, j]) => line3(P[i], P[j], step, warm, cyan)); }
function coil3(cx, cy, z, r, step) { const n = Math.round(2 * Math.PI * r / step); for (let k = 0; k < 2; k++) for (let i = 0; i < n; i++) { const a = i / n * 6.283; PTS.push([cx + Math.cos(a) * (r - k * 0.05), cy + Math.sin(a) * (r - k * 0.05), z, 1]); } }
(() => {
  const S = 0.075;
  for (let x = -4.5; x <= 4.5; x += 1.0) line3([x, 0, -1.5], [x, 0, -9], S * 1.4); // floor plan grid
  for (let z = -1.5; z >= -9; z -= 1.0) line3([-4.5, 0, z], [4.5, 0, z], S * 1.4);
  box3(-4.5, 0, -9, 4.5, 3.4, -9, S); // back wall outline
  for (const side of [-1, 1]) { const xa = side * 1.7, xb = side * 4.2; // shelving units with scrap on them
    for (const y of [0.05, 0.75, 1.45, 2.15, 2.85]) line3([Math.min(xa, xb), y, -7.6], [Math.max(xa, xb), y, -7.6], S), line3([Math.min(xa, xb), y, -6.9], [Math.max(xa, xb), y, -6.9], S);
    for (const x of [xa, (xa + xb) / 2, xb]) line3([x, 0, -7.6], [x, 2.85, -7.6], S), line3([x, 0, -6.9], [x, 2.85, -6.9], S);
    const r = rng(side > 0 ? 7 : 9);
    for (const y of [0.05, 0.75, 1.45, 2.15]) for (let i = 0; i < 3; i++) { const x = Math.min(xa, xb) + 0.4 + i * 0.8 + r() * 0.2;
      if (r() < 0.5) coil3(x, y + 0.28, -7.25, 0.24, S * 0.8); else box3(x - 0.25, y, -7.5, x + 0.25, y + 0.45, -7.0, S); } }
  box3(-2.3, 0, -3.6, 2.3, 1.0, -2.6, S * 0.9); // the X-ray counter (warm top edge = the small accent)
  line3([-2.3, 1.0, -2.6], [2.3, 1.0, -2.6], S * 0.5, true); line3([-2.3, 1.0, -3.6], [2.3, 1.0, -3.6], S * 0.5, true);
  box3(-0.4, 3.0, -4.6, 0.4, 3.1, -4.2, S * 0.6, true); // hanging scan lamp
})();
const CAM = [[0, [0, 1.95, 3.6]], [3.0, [0, 1.6, 2.4]], [8.6, [0.25, 1.5, 2.0]], [12.7, [0, 1.85, 3.1]], [18.3, [-0.3, 1.7, 2.6]], [22.9, [0, 2.35, 3.7]], [25.9, [0, 2.05, 5.0]], [30, [0, 2.05, 5.5]]];
function camAt(t) { for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) { const [ta, a] = CAM[i - 1], [tb, b] = CAM[i]; const k = ease(clamp((t - ta) / (tb - ta))); return a.map((v, j) => lerp(v, b[j], k)); } return CAM[CAM.length - 1][1]; }
function pointCloud(t, dim) {
  const [cx, cy, cz] = camAt(t), f = 1050;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(W / 2, H * 0.55, 100, W / 2, H * 0.55, 1200); vg.addColorStop(0, 'rgba(30,40,46,0.55)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  for (const [x, y, z, k] of PTS) {
    const d = cz - z; if (d < 0.4) continue;
    const sx = W / 2 + f * (x - cx) / d, sy = H * 0.56 - f * (y - cy) / d;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const a = clamp(3.4 / d, 0.24, 0.85) * dim, r = clamp(4.2 / d + 0.9, 1.2, 2.7);
    g.fillStyle = k === 2 ? `rgba(${C.warmRGB},${Math.min(1, a * 1.6)})` : k === 1 ? `rgba(${C.cyan},${a})` : `rgba(${C.dot},${a * 0.8})`;
    g.beginPath(); g.arc(sx, sy, r, 0, 6.283); g.fill();
  }
}

// ---------- the accepted simplified open-lid can mascot (cylinder, lid, two eyes, two arms) ----------
function mascot(x, base, s, p) {
  const bw = 170 * s, bh = 215 * s, X = x, Y = base - (p.hop || 0), top = Y - bh;
  const shoulder = (side) => [X + side * bw / 2, top + bh * 0.56];
  const hand = (side, a) => { const [sx, sy] = shoulder(side); return [sx + Math.cos(a[0]) * a[1] * s * side, sy + Math.sin(a[0]) * a[1] * s]; };
  const arm = (side, a, white) => { const [sx, sy] = shoulder(side), [hx, hy] = hand(side, a); g.beginPath(); g.moveTo(sx, sy);
    g.quadraticCurveTo(sx + side * 40 * s, (sy + hy) / 2 + 30 * s, hx, hy); g.strokeStyle = white ? '#fff6e8' : '#c47a42'; g.lineWidth = (white ? 24 : 11) * s; g.lineCap = 'round'; g.stroke();
    g.beginPath(); g.arc(hx, hy, (white ? 25 : 17) * s, 0, 7); g.fillStyle = white ? '#fff6e8' : C.glove; g.fill(); };
  const lidA = p.lid ?? -0.5;
  const drawLid = (white) => { g.save(); g.translate(X - bw * 0.06, top - 4 * s); g.rotate(lidA); g.beginPath(); g.ellipse(0, -bw * 0.42, bw * 0.47 + (white ? 10 : 0), bw * 0.47 + (white ? 10 : 0), 0, 0, 7); g.fillStyle = white ? '#fff6e8' : C.tinLight; g.fill();
    if (!white) { g.strokeStyle = C.tinDark; g.lineWidth = 6 * s; g.stroke(); } g.restore(); };
  g.save(); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowOffsetY = 14 * s; g.shadowBlur = 24 * s;
  drawLid(true); arm(-1, p.armR, true); arm(1, p.armL, true); rr(X - bw / 2 - 10 * s, top - 14 * s, bw + 20 * s, bh + 24 * s, 26 * s); g.fillStyle = '#fff6e8'; g.fill();
  g.shadowColor = 'transparent'; drawLid(false);
  rr(X - bw / 2, top, bw, bh, 18 * s); g.fillStyle = C.tin; g.fill();
  g.fillStyle = C.tinLight; g.fillRect(X - bw / 2 + 12 * s, top + 6 * s, 22 * s, bh - 12 * s); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(X + bw / 2 - 30 * s, top + 6 * s, 22 * s, bh - 12 * s);
  g.beginPath(); g.ellipse(X, top + 3 * s, bw / 2 - 4 * s, 13 * s, 0, 0, 7); g.fillStyle = C.tinDark; g.fill(); g.beginPath(); g.ellipse(X, top + 5 * s, bw / 2 - 16 * s, 8 * s, 0, 0, 7); g.fillStyle = '#5c6168'; g.fill();
  const ly = top + bh * 0.52; g.fillStyle = C.cream; g.fillRect(X - bw / 2, ly, bw, bh * 0.34); g.fillStyle = C.warm; g.fillRect(X - bw / 2, ly, bw, 10 * s); g.fillStyle = C.green; g.fillRect(X - bw / 2, ly + bh * 0.34 - 7 * s, bw, 7 * s);
  for (const side of [-1, 1]) { const ex = X + side * bw * 0.22, ey = top + bh * 0.3; g.beginPath(); g.ellipse(ex, ey, 27 * s, 30 * s, 0, 0, 7); g.fillStyle = '#fffaf0'; g.fill();
    const [lx, lyy] = p.look || [0, 0]; g.beginPath(); g.arc(ex + lx * 9 * s, ey + lyy * 9 * s, 12 * s, 0, 7); g.fillStyle = C.ink; g.fill(); g.beginPath(); g.arc(ex + lx * 9 * s + 4 * s, ey + lyy * 9 * s - 5 * s, 3.5 * s, 0, 7); g.fillStyle = '#fff'; g.fill();
    if (p.blink) { g.fillStyle = C.tin; g.fillRect(ex - 30 * s, ey - 32 * s, 60 * s, 62 * s * p.blink); }
    if (p.stern) { g.strokeStyle = C.ink; g.lineWidth = 6 * s; g.beginPath(); g.moveTo(ex - 22 * s, ey - 38 * s - side * 6 * s); g.lineTo(ex + 22 * s, ey - 38 * s + side * 6 * s); g.stroke(); } }
  arm(-1, p.armR, false); arm(1, p.armL, false);
  g.restore();
  return { hand: (side) => hand(side, side > 0 ? p.armL : p.armR) };
}

// ---------- brass props (solid foreground objects) with X-ray reveal ----------
const BR = { brass: '#d4a537', brassHi: '#f2cd6b', brassDark: '#9c7419', tarnish: '#7c6c4c', steel: '#7d8790', steelDark: '#4f565e' };
function xrayClip(x0, y0, x1, y1, reveal, draw) { // draw() inside the part of the box the scan has passed, plus scan bar
  if (reveal <= 0) return; const rx = x0 + (x1 - x0) * reveal; g.save(); g.beginPath(); g.rect(x0, y0, rx - x0, y1 - y0); g.clip(); draw(); g.restore();
  if (reveal < 1) { g.fillStyle = 'rgba(143,211,224,0.35)'; g.fillRect(rx - 10, y0, 20, y1 - y0); g.fillStyle = 'rgba(200,240,250,0.95)'; g.fillRect(rx - 2, y0, 4, y1 - y0); }
}
function tapShape(x, y, s, col, hi) { // a recognisable old basin tap: body, spout, cross handle
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; rr(-60, -40, 120, 110, 26); g.fill();                         // body
  g.beginPath(); g.moveTo(40, -10); g.quadraticCurveTo(170, -20, 175, 70); g.lineTo(145, 70); g.quadraticCurveTo(140, 15, 40, 25); g.closePath(); g.fill(); // spout
  g.fillRect(-14, -80, 28, 44); rr(-70, -100, 140, 30, 15); g.fill();            // stem + cross handle
  g.fillStyle = hi; g.fillRect(-44, -30, 14, 84); g.fillRect(-60, -96, 60, 8); g.restore();
}
function tap(x, y, s, reveal, label) {
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20; tapShape(x, y, s, BR.tarnish, 'rgba(255,255,255,0.12)'); g.restore();
  xrayClip(x - 80 * s, y - 110 * s, x + 185 * s, y + 80 * s, reveal, () => tapShape(x, y, s, BR.brass, BR.brassHi));
}
function handleShape(x, y, s, col, hi, core) { // lever door handle on a round rose
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.arc(0, 0, 58, 0, 7); g.fill(); rr(-20, -22, 230, 44, 22); g.fill();
  if (core) { g.fillStyle = core; g.beginPath(); g.arc(0, 0, 50, 0, 7); g.fill(); rr(-12, -14, 214, 28, 14); g.fill(); }
  g.fillStyle = hi; g.fillRect(-8, -18, 200, 7); g.beginPath(); g.arc(-18, -18, 12, 0, 7); g.fill(); g.restore();
}
function doorHandle(x, y, s, kind, reveal = 0, screws = false) { // kind: 'brass' solid, 'plated' brass-plated steel
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20; handleShape(x, y, s, BR.brass, BR.brassHi); g.restore();
  if (screws) for (const [dx, dy] of [[-30, -30], [30, 30]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, 13 * s, 0, 7); g.fillStyle = BR.steel; g.fill(); g.strokeStyle = BR.steelDark; g.lineWidth = 4 * s; g.beginPath(); g.moveTo(x + (dx - 8) * s, y + dy * s); g.lineTo(x + (dx + 8) * s, y + dy * s); g.stroke(); }
  if (kind === 'plated') xrayClip(x - 70 * s, y - 70 * s, x + 220 * s, y + 70 * s, reveal, () => { handleShape(x, y, s, 'rgba(212,165,55,0.35)', 'rgba(255,255,255,0.1)', BR.steel); });
  else xrayClip(x - 70 * s, y - 70 * s, x + 220 * s, y + 70 * s, reveal, () => { handleShape(x, y, s, BR.brass, BR.brassHi); });
}
function fitting(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 10; g.shadowBlur = 16; // elbow pipe fitting
  g.fillStyle = BR.brass; rr(-70, -26, 100, 52, 10); g.fill(); rr(4, -26, 52, 110, 10); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = BR.brassDark; g.fillRect(-74, -30, 14, 60); g.fillRect(0, 70, 60, 14); g.fillStyle = BR.brassHi; g.fillRect(-56, -18, 70, 7); g.restore(); }
function valve(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 10; g.shadowBlur = 16; // small ball valve
  g.fillStyle = BR.brass; rr(-80, -28, 160, 56, 14); g.fill(); g.beginPath(); g.arc(0, 0, 44, 0, 7); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#c0392b'; rr(-8, -96, 120, 26, 10); g.fill(); g.fillRect(-8, -80, 16, 40); g.fillStyle = BR.brassHi; g.fillRect(-60, -18, 120, 6); g.restore(); }
function magnet(x, y, s = 1) { g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 10; g.shadowBlur = 18;
  g.fillStyle = '#c0392b'; g.beginPath(); g.moveTo(-80, -70); g.lineTo(80, -70); g.lineTo(80, 50); g.lineTo(38, 50); g.lineTo(38, -20); g.lineTo(-38, -20); g.lineTo(-38, 50); g.lineTo(-80, 50); g.closePath(); g.fill();
  g.shadowColor = 'transparent'; g.fillStyle = '#dfe3e8'; g.fillRect(-80, 30, 42, 22); g.fillRect(38, 30, 42, 22); g.restore(); }
function tray(x, y, w, text, fill, a = 1) { g.save(); g.globalAlpha *= a; g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20;
  g.beginPath(); g.moveTo(x - w / 2, y - 40); g.lineTo(x + w / 2, y - 40); g.lineTo(x + w / 2 - 18, y + 46); g.lineTo(x - w / 2 + 18, y + 46); g.closePath(); g.fillStyle = '#59616b'; g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#7d8790'; g.fillRect(x - w / 2, y - 46, w, 12); if (fill) fill(); textC(text, x, y + 16, 34, C.cream, 800); g.restore(); }
function ticket(x, y, rot, title, a) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowOffsetY = 10; g.shadowBlur = 18;
  rr(-120, -90, 240, 180, 18); g.fillStyle = C.cream; g.fill(); g.shadowColor = 'transparent'; g.beginPath(); g.arc(0, -66, 9, 0, 7); g.fillStyle = '#07090b'; g.fill();
  textC(title, 0, -26, 30, C.ink, 800); textC('₹ ?', 0, 34, 64, C.warm, 800); g.restore(); }

// ---------- scenes ----------
function sHook(t, a) { // 0 - 3.0: mascot holds an old tap; X-ray reveals the brass under the tarnish
  g.save(); g.globalAlpha = a;
  const m = mascot(300, 1430, 1.25, { armL: [-0.15, 115], armR: [1.15, 70], look: [0.8, 0.1], lid: -0.5, blink: (t > 2.45 && t < 2.55) ? 1 : 0 });
  const [hx, hy] = m.hand(1); tap(hx + 140, hy - 20, 1.25, easeOut(prog(t, 0.9, 2.0)));
  label('BRASS', 760, 760, prog(t, 2.0, 2.25), { size: 44, warm: true, to: [700, 900] });
  g.restore();
}
function sTray(t, a) { // 3.0 - 8.3: tray of recognisable brass objects, then copper + zinc
  g.save(); g.globalAlpha = a;
  const k = easeOut(prog(t, 3.0, 3.5)), ty = lerp(1700, 1260, k);
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 14; g.shadowBlur = 24; rr(110, ty - 40, 860, 230, 26); g.fillStyle = '#3a4048'; g.fill(); g.restore();
  rr(130, ty - 22, 820, 196, 20); g.fillStyle = '#2a2f35'; g.fill();
  const items = [['TAP', 3.55, (x, y) => tapShape(x, y, 0.62, BR.brass, BR.brassHi), 260], ['DOOR HANDLE', 4.15, (x, y) => handleShape(x - 60, y + 6, 0.6, BR.brass, BR.brassHi), 540], ['FITTING', 4.75, (x, y) => fitting(x, y - 10, 0.8), 800]];
  items.forEach(([name, ts, draw, x]) => { const d = back(prog(t, ts, ts + 0.3)); if (d <= 0) return; g.save(); g.translate(x, ty + 80); g.scale(d, d); g.translate(-x, -(ty + 80)); g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowOffsetY = 8; g.shadowBlur = 12; draw(x, ty + 80); g.restore();
    label(name, x, ty - 90, prog(t, ts + 0.1, ts + 0.35), { size: 36 }); });
  // composition: copper + zinc
  if (t > 6.3) { const c = back(prog(t, 6.3, 6.75)); const cx = 540, cy = 860, R = 210 * c;
    g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 40; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fillStyle = BR.brass; g.fill(); g.restore();

const SCENES = [[sHook, 0, 3.0], [sTray, 3.0, 8.3], [sMagnet, 8.3, 12.6], [sGrade, 12.6, 18.5], [sQuotes, 18.5, 23.0], [sRecap, 23.0, 25.9], [sCTA, 25.9, 30.1]];
const XF = 0.3; // short dissolve between scenes (camera travel carries the move)

// ---------- captions: upper safe region, ink y ~340-520, x 90-990, max 2 lines ----------
const GROUPS = {

const plain = (s) => s.replace(/[\[\]|]/g, ' ').replace(/\s+/g, ' ').trim();

}
