<script type="module">
// WastePaisa feedback-round 01 "What's inside an old cable" in the 'Scrap Shop X-ray' variation:
// dark point-cloud scrap shop (static, world-anchored dots, parallax via smooth camera travel),
// solid readable mascot + objects in the foreground, X-ray reveal, large colour-coded cross-section,
// buyer trays + scale, no-burn sign, takeaway and WastePaisa CTA. Every frame is a pure function of t.
const W = 1080, H = 1920, BASE = '/production/30s/2026-11-02-feedback-round';
const cv = document.getElementById('c'); const g = cv.getContext('2d');
const C = { bg: '#07090b', dot: '233,241,242', cyan: '143,211,224', warm: '#f46d12', warmRGB: '244,109,18', cream: '#fef7ee', green: '#1a6535', ink: '#1d130e',

  sheath: '#3a4048', panel: 'rgba(8,10,12,0.74)' };

// ---------- helpers ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }

// ---------- point-cloud scrap shop (world space, seeded once, never re-randomised) ----------
const PTS = [];

    const [lx, lyy] = p.look || [0, 0]; g.beginPath(); g.arc(ex + lx * 9 * s, ey + lyy * 9 * s, 12 * s, 0, 7); g.fillStyle = C.ink; g.fill(); g.beginPath(); g.arc(ex + lx * 9 * s + 4 * s, ey + lyy * 9 * s - 5 * s, 3.5 * s, 0, 7); g.fillStyle = '#fff'; g.fill();

// ---------- cables (solid foreground objects) with X-ray reveal ----------
// kind: 'cu' copper power cable, 'al' aluminium power cable, 'data' thin multi-pair data cable with connector

function tray(x, y, w, text, fill, a = 1) { g.save(); g.globalAlpha = a; g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowOffsetY = 12; g.shadowBlur = 20;
