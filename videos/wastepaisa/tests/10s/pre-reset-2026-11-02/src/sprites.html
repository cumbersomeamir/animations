<script type="module">
// Renders the approved Tinku rig (education/pilot-01/src/rig/tinku.js) as transparent pose sprites.

  pull:  { yaw: 0.2, pose: { handL: [0.78, 0.74, 0.25], handR: [-0.74, 0.7, 0.25], eyeScale: 1.08, mouthOpen: 0.5, smile: 0.3, browL: 0.9, browR: 0.9, earL: 1, earR: 1, squash: 0.95 } },
  pin:   { yaw: 0.45, pose: { handL: [0.62, 1.28, 0.3], handR: [-0.42, 0.34, 0.08], look: [0.7, 0.8], smile: 0.9, browL: 0.6, browR: 0.6, lean: -0.08 } },
