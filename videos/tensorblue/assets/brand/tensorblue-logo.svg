<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="TensorBlue logo">
  <title>TensorBlue</title>
  <desc>A water droplet filled with a tensor grid — water meets math.</desc>

  <defs>
    <clipPath id="drop-clip">
      <path d="M 100 20 C 100 20, 170 110, 170 175 C 170 219, 138 250, 100 250 C 62 250, 30 219, 30 175 C 30 110, 100 20, 100 20 Z"/>
    </clipPath>
  </defs>

  <!-- The water drop (pointed top, round bottom) -->
  <path d="M 100 20 C 100 20, 170 110, 170 175 C 170 219, 138 250, 100 250 C 62 250, 30 219, 30 175 C 30 110, 100 20, 100 20 Z"
        fill="#0A6CFF"/>

  <!-- Tensor grid inside the drop -->
  <g clip-path="url(#drop-clip)" stroke="#FFFFFF" stroke-width="1.6" opacity="0.55">
    <line x1="20" y1="110" x2="180" y2="110"/>
    <line x1="20" y1="145" x2="180" y2="145"/>
    <line x1="20" y1="180" x2="180" y2="180"/>
    <line x1="20" y1="215" x2="180" y2="215"/>
    <line x1="65" y1="10" x2="65" y2="260"/>
    <line x1="100" y1="10" x2="100" y2="260"/>
    <line x1="135" y1="10" x2="135" y2="260"/>
  </g>

  <!-- Tensor cell nodes -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="65" cy="145" r="3.5"/>
    <circle cx="100" cy="145" r="3.5"/>
    <circle cx="135" cy="145" r="3.5"/>
    <circle cx="65" cy="180" r="3.5"/>
    <circle cx="100" cy="180" r="3.5"/>
    <circle cx="135" cy="180" r="3.5"/>
    <circle cx="65" cy="215" r="3.5"/>
    <circle cx="100" cy="215" r="3.5"/>
    <circle cx="135" cy="215" r="3.5"/>
  </g>
</svg>
